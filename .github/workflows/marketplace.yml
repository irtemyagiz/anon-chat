name: Marketplace

on:
  push:
    paths:
      - 'marketplace/**'
      - '.github/workflows/marketplace.yml'
  pull_request:
    paths:
      - 'marketplace/**'
      - '.github/workflows/marketplace.yml'

permissions:
  contents: read

concurrency:
  group: marketplace-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: marketplace

jobs:
  php:
    name: PHP testleri (SQLite + MariaDB)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: marketplace_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, pdo_mysql, gd, zip, fileinfo, intl, bcmath, pcntl
          coverage: none

      - name: Composer önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('marketplace/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Ortam dosyası
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Kod stili (Pint)
        run: vendor/bin/pint --test

      - name: Testler (SQLite)
        run: php artisan test --compact

      - name: Testler (MariaDB)
        run: php artisan test --compact
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: marketplace_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Eşzamanlı harcama testleri (MariaDB + pcntl)
        run: php artisan test --compact --group=concurrency
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: marketplace_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Bağımlılık güvenlik denetimi
        run: composer audit

  assets:
    name: Ön yüz derlemesi
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: marketplace/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev
